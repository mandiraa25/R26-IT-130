  <nav class="topnav" aria-label="Game navigation">

        <sc-if value="{{musicMuted}}" hint-placeholder-val="{{ false }}"><svg style="position:absolute;inset:14px" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34 L34 6" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 34 L34 6" stroke="#D9472B" stroke-width="4" stroke-linecap="round"/></svg></sc-if>

  <div class="tracker" style="top:110px;left:740px" role="img" aria-label="{{trkLabel}}">
    <img src="../assets/d21f61cf7dfb32ed20cab63dae9199ad.png" alt="">

  </div>

  <div class="bubble">Look at the pattern carefully and guess it!</div>
  <div class="dot" style="left:196px;top:316px;width:22px;height:22px"></div>
  <div class="dot" style="left:182px;top:348px;width:13px;height:13px"></div>
  <img src="../assets/044c7ae59144599a3e2a41c9e1b3011a.webp" alt="" style="position:absolute;left:28px;bottom:36px;height:400px;transform:rotate(5deg);transform-origin:50% 100%;filter:drop-shadow(0 8px 12px rgba(10,10,40,.5))">

  <div class="board">
    <img class="bucket" src="../assets/e0fefd916f5e1675e16f8022aeda3761.png" alt="">
    <div class="inner">
      <div style="display:flex;align-items:center;gap:14px">
        <h1 style="margin:0;font-size:34px;font-weight:700">{{title}}</h1>
        <button class="iconbtn" style="width:50px;height:50px;background:#EAE2F8;box-shadow:none" aria-label="Read the question aloud"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 v4 h4 l5 4 V6 L8 10 Z" fill="#4B2F86"/><path d="M16 9 q3 3 0 6" stroke="#4B2F86" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
      </div>

      <div style="{{bodyStyle}}">
        <sc-if value="{{isSeqKind}}" hint-placeholder-val="{{ false }}">
          <div class="seq" role="img" aria-label="{{puzzleLabel}}">
            <sc-for list="{{items}}" as="s" hint-placeholder-count="8">
              <div class="slot" style="{{s.slotStyle}}">
                <sc-if value="{{s.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{s.src}}" alt="" style="{{s.imgStyle}}"></sc-if>
                <sc-if value="{{s.isGap}}" hint-placeholder-val="{{ false }}"><span class="q" style="width:70px;height:70px;font-size:40px">?</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isMatrixKind}}" hint-placeholder-val="{{ false }}">
          <div role="img" aria-label="{{puzzleLabel}}" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#fff;border:3px solid #E3DAF2;border-radius:26px;padding:12px">
            <sc-for list="{{items}}" as="c" hint-placeholder-count="9">
              <div class="cell" style="{{c.slotStyle}}">
                <sc-if value="{{c.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{c.src}}" alt="" style="{{c.imgStyle}}"></sc-if>
                <sc-if value="{{c.isGap}}" hint-placeholder-val="{{ false }}"><span class="q" style="width:70px;height:70px;font-size:40px">?</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isGridKind}}" hint-placeholder-val="{{ false }}">
          <div role="img" aria-label="{{puzzleLabel}}" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#FFFDF7;border:4px solid #6A4CB0;border-radius:14px;overflow:hidden">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
              <div style="{{t.boxStyle}}">
                <sc-if value="{{t.isTile}}" hint-placeholder-val="{{ true }}">
                  <svg width="130" height="130" viewBox="0 0 100 100" aria-hidden="true"><rect x="0" y="0" width="100" height="100" fill="none" stroke="#6A4CB0" stroke-width="2"/><path d="{{t.h1}}" fill="#F7C531" stroke="#6A4CB0" stroke-width="2" stroke-linejoin="round"/><path d="{{t.h2}}" fill="none" stroke="#6A4CB0" stroke-width="2" stroke-linejoin="round"/></svg>
                </sc-if>
                <sc-if value="{{t.isGap}}" hint-placeholder-val="{{ false }}"><span class="q" style="width:104px;height:104px;font-size:52px">?</span></sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div style="{{optsStyle}}">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
            <button class="opt" style="{{o.style}}" onClick="{{o.pick}}" aria-label="{{o.aria}}"><b>{{o.letter}}</b>
              <sc-if value="{{o.isIcon}}" hint-placeholder-val="{{ true }}"><img src="{{o.src}}" alt="" style="{{o.imgStyle}}"></sc-if>
              <sc-if value="{{o.isTile}}" hint-placeholder-val="{{ false }}"><svg width="92" height="92" viewBox="-3 -3 106 106" aria-hidden="true"><rect x="0" y="0" width="100" height="100" fill="#FFFDF7" stroke="#6A4CB0" stroke-width="3"/><path d="{{o.h1}}" fill="#F7C531" stroke="#6A4CB0" stroke-width="3" stroke-linejoin="round"/><path d="{{o.h2}}" fill="none" stroke="#6A4CB0" stroke-width="3" stroke-linejoin="round"/></svg></sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="margin-top:auto;height:66px;display:flex;align-items:center;gap:18px">
        <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
          <button class="go" style="{{checkStyle}}" onClick="{{check}}">Check</button>
        </sc-if>
        <sc-if value="{{isRight}}" hint-placeholder-val="{{ false }}">
          <div class="msg" style="background:#E3F3DC;color:#2C5A28"><svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#2C5A28"/><path d="M13 22 l6 6 12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>{{rightMsg}}</div>
          <a class="go" href="{{next}}" style="background:#5E3FA3;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)">{{nextLabel}}<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </sc-if>
        <sc-if value="{{isWrong}}" hint-placeholder-val="{{ false }}">
          <div class="msg" style="background:#FFF0DD;color:#8A4006">Good try! Let's try again!</div>
          <button class="go" style="background:#fff;color:#4B2F86;border:3px solid #8A6BC9" onClick="{{retry}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 a8 8 0 1 0 3 -6.2 M4 4 v5 h5" fill="none" stroke="#4B2F86" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Try again</button>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: null, result: null }; }
  trackVals(cur) {
    if (typeof cur !== 'number' || isNaN(cur)) cur = (this.state && typeof this.state.q === 'number') ? this.state.q : 0;
    const CX = [46.5, 148.4, 250.3, 352.2, 454.0];
    const tick = "url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22><circle cx=%2210%22 cy=%2210%22 r=%229%22 fill=%22%233FA34D%22 stroke=%22white%22 stroke-width=%222%22/><path d=%22M6 10.5l2.6 2.6L14 7.6%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>') no-repeat right -1px top -1px / 19px 19px";
    return {
      trk: CX.map((x, i) => ({ style: 'left:' + (x - 22.5) + 'px;' + (i < cur ? 'background:' + tick + ';' : i === cur ? 'animation:trkpulse 1.6s ease-in-out infinite;transform:scale(1.1)' : 'background:rgba(55,30,10,.45)') })),
      trkLabel: 'Step ' + (cur + 1) + ' of 5'
    };
  }
  rec(i, ok) {
    // Saves the first answer for each question so the results screen can show the score.
    try {
      const ss = window.sessionStorage, k = 'lexi:res:Pattern:L4', m = JSON.parse(ss.getItem(k) || '{}');
      if (!(i in m)) {
        m[i] = ok; ss.setItem(k, JSON.stringify(m));
        if (ok) { const ls = window.localStorage; ls.setItem('lexi:totalStars', String((parseInt(ls.getItem('lexi:totalStars') || '0', 10) || 0) + 5)); }
      }
      ss.setItem('lexi:last', 'Pattern:L4');
    } catch (e) {}
  }
  resetRec() { try { window.sessionStorage.removeItem('lexi:res:Pattern:L4'); } catch (e) {} }
  navVals() {
    const VW = (typeof window !== 'undefined' && window.innerWidth) || 1600, VH = (typeof window !== 'undefined' && window.innerHeight) || 900;
    if (!this._fitOn && typeof window !== 'undefined') { this._fitOn = true; window.addEventListener('resize', () => this.setState({})); }
    const N = this.nav || (this.nav = { lang: 'en', muted: false });
    const st = (this.state && typeof this.state.stars === 'number') ? this.state.stars : 0;
    const on = 'color:#fff', off = 'color:#6B3A1E';
    return {
      navStars: String(st), navStarsLabel: st + (st === 1 ? ' star' : ' stars'),
      stageStyle: 'transform:translate(-50%,-50%) scale(' + Math.min(VW / 1600, VH / 900) + ')',
      musicMuted: N.muted, musicLabel: N.muted ? 'Turn music on' : 'Turn music off',
      toggleMusic: () => { N.muted = !N.muted; this.setState({}); },
      navLangSrc: N.lang === 'en' ? '../assets/6f7c2bb7a5525738674145255fc58787.png' : '../assets/825f199a805633d8f930859013f1c3b0.png', isEn: N.lang === 'en', isSi: N.lang === 'si',
      enStyle: 'left:16px;' + (N.lang === 'en' ? on : off), siStyle: 'left:66px;' + (N.lang === 'si' ? on : off),
      setEn: () => { N.lang = 'en'; this.setState({}); }, setSi: () => { N.lang = 'si'; this.setState({}); }
    };
  }
  renderVals() {
    const A = { orange:'../assets/19d4355ff2552ff14b9187e49d717d3a.svg', blue:'../assets/9f89215fc022ae1e71fac88fa51c99e2.svg', green:'../assets/ea0eb8db753c83064d8606a2efdae817.svg', purple:'../assets/bcd893767c0dd35f1e5628a8eb9b8476.svg', carrot:'../assets/277ebc5eed6161299f9afb7c3af067a5.svg', apple:'../assets/b564c64dfe55eb342d9a8e4dacad5840.svg', leaf:'../assets/55b9611b9adb114aa3fcd2cd022c689b.svg', flower:'../assets/2adfd57cc4f9879fa40a5588e2e0f537.svg', star:'../assets/08972e9a7b847e601287bdb7cfcdfd8a.svg', heart:'../assets/f97054304c9330c9ea85ef7dcb0d6544.svg', moon:'../assets/c24e3f90ec771704f719713c7e374cc5.svg', tri:'../assets/b8874f3d31415b1e0836e0f5aac9a0a6.svg', square:'../assets/ae368405d0a1ad059f1254c11cfbf16e.svg' };
    // Leaf tiles: a leaf along one diagonal, with one half coloured yellow.
    // LL / UR = leaf from top-left to bottom-right, yellow on the bottom-left / top-right half.
    // UL / LR = leaf from bottom-left to top-right, yellow on the top-left / bottom-right half.
    const H = { LL:'M0 0 A100 100 0 0 0 100 100 Z', UR:'M0 0 A100 100 0 0 1 100 100 Z', UL:'M0 100 A100 100 0 0 1 100 0 Z', LR:'M0 100 A100 100 0 0 0 100 0 Z' };
    const PAIR = { LL:'UR', UR:'LL', UL:'LR', LR:'UL' };
    const TLABEL = { LL:'leaf from top-left to bottom-right, yellow on the bottom-left side', UR:'leaf from top-left to bottom-right, yellow on the top-right side', UL:'leaf from bottom-left to top-right, yellow on the top-left side', LR:'leaf from bottom-left to top-right, yellow on the bottom-right side' };

    // ---- Question data ----
    // kind: 'seq' (a row, null = the gap), 'matrix' (3×3 pictures, null = the gap), 'grid' (2×2 leaf tiles, null = the gap)
    // pictures: [picture, spoken label, size px, turn degrees]; leaf tiles: 'LL' | 'UR' | 'UL' | 'LR'
    // Tiles in order: top-left, top-right, bottom-left, bottom-right.
    // The leaves spin clockwise around the middle like a windmill: top-left → top-right → bottom-right → bottom-left.
    const Q = {
      n: 4, total: 5,
      title: 'Which tile fits the empty space?',
      kind: 'grid',
      items: ['LL', 'UL', null, 'UR'],
      opts: ['UL', 'LR', 'LL', 'UR'],
      answer: 1,
      next: 'Pattern-L4-Q5.dc.html', nextLabel: 'Next', rightMsg: 'Great job! The leaves spin around!'
    };
    // ------------------------
    const { picked, result } = this.state;
    const right = result === 'right', wrong = result === 'wrong';
    const isGrid = Q.kind === 'grid';
    const size = (s, r, d) => 'width:' + (s || d) + 'px;height:' + (s || d) + 'px' + (r ? ';transform:rotate(' + r + 'deg)' : '');
    const ans = Q.opts[Q.answer];
    const GREEN = 'background:#E3F3DC;box-shadow:inset 0 0 0 4px #2C5A28';
    const icon = (s) => s
      ? { hasImg: true, isGap: false, src: A[s[0]], imgStyle: size(s[2], s[3], 62), slotStyle: '' }
      : (right
        ? { hasImg: true, isGap: false, src: A[ans[0]], imgStyle: size(ans[2] ? Math.round(ans[2] * 0.8) : 0, ans[3], 62), slotStyle: GREEN }
        : { hasImg: false, isGap: true, src: '', imgStyle: '', slotStyle: 'background:transparent' });
    const items = isGrid ? [] : Q.items.map(icon);
    const BOX = 'width:130px;height:130px;display:flex;align-items:center;justify-content:center;box-sizing:border-box';
    const tiles = !isGrid ? [] : Q.items.map((f) => {
      if (f) return { isTile: true, isGap: false, h1: H[f], h2: H[PAIR[f]], boxStyle: BOX };
      if (right) return { isTile: true, isGap: false, h1: H[ans], h2: H[PAIR[ans]], boxStyle: BOX + ';background:#E3F3DC' };
      return { isTile: false, isGap: true, h1: '', h2: '', boxStyle: BOX + ';background:#F4EFFC' };
    });
    const opts = Q.opts.map((o, i) => {
      const TINT = ['background:#FFF1E3;border-color:#F6CFA4;box-shadow:0 5px 0 #EFC79B', 'background:#EAF3FE;border-color:#BFD7F5;box-shadow:0 5px 0 #B3CDEE', 'background:#EAF7EC;border-color:#BFE3C4;box-shadow:0 5px 0 #B2DAB8', 'background:#F4EDFC;border-color:#D7C6F1;box-shadow:0 5px 0 #CCB8EC'];
      let style = TINT[i];
      if (picked === i && right) style = 'border-color:#2C5A28;box-shadow:0 0 0 6px #CFE8C6;background:#F2FAEE;transform:translateY(-4px)';
      else if (picked === i && wrong) style = 'border-color:#D9822B;border-style:dashed;background:#FFF6EA';
      else if (picked === i) style = TINT[i] + ';' + 'border-color:#8A6BC9;box-shadow:0 0 0 6px #E3DAF5;transform:translateY(-4px)';
      return { letter: 'ABCD'[i], isTile: isGrid, isIcon: !isGrid,
        src: isGrid ? '' : A[o[0]], imgStyle: isGrid ? '' : size(o[2], o[3], 76),
        h1: isGrid ? H[o] : '', h2: isGrid ? H[PAIR[o]] : '', style,
        aria: (isGrid ? TLABEL[o] : o[1]) + (picked === i ? ', selected' : ''),
        pick: () => { if (this.state.result !== 'right') this.setState({ picked: i, result: null }); } };
    });
    const dots = [];
    for (let i = 1; i <= Q.total; i++) dots.push({ style: i < Q.n ? 'background:#4B2F86' : (i === Q.n ? 'background:#8A6BC9;box-shadow:0 0 0 3px #E3DAF5' : 'background:#E2DCCD') });
    const sideBySide = Q.kind !== 'seq';
    return { ...this.navVals(), ...this.trackVals(Q.n - 1),
      title: Q.title, items, tiles, opts, dots,
      isSeqKind: Q.kind === 'seq', isMatrixKind: Q.kind === 'matrix', isGridKind: isGrid,
      bodyStyle: sideBySide ? 'display:flex;flex-direction:row;align-items:center;gap:56px' : 'display:flex;flex-direction:column;align-items:center;gap:26px',
      optsStyle: sideBySide ? 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px' : 'display:flex;gap:22px',
      progressText: Q.n + ' / ' + Q.total, progressLabel: 'Question ' + Q.n + ' of ' + Q.total,
      puzzleLabel: Q.items.map((s) => s ? (isGrid ? TLABEL[s] : s[1]) : 'missing').join(', '),
      showCheck: !right && !wrong, isRight: right, isWrong: wrong,
      checkStyle: picked === null ? 'background:#E5DED1;color:#6B6155;pointer-events:none' : 'background:#5E3FA3;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)',
      check: () => { if (this.state.picked !== null) { const ok = this.state.picked === Q.answer; this.rec(Q.n - 1, ok); this.setState({ result: ok ? 'right' : 'wrong' }); } },
      retry: () => this.setState({ picked: null, result: null }),
      next: Q.next, nextLabel: Q.nextLabel, rightMsg: Q.rightMsg
    };
  }
}
</script>
</body>
