<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Memory Level 1 Memorise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6E3F18}a:hover{color:#4A2A10}
.root{position:relative;width:1280px;height:800px;overflow:hidden;font-family:'Lexend',system-ui,sans-serif;color:#2E2A26}
.board{position:absolute;left:318px;top:112px;width:932px;height:600px;box-sizing:border-box;border-style:solid;border-width:134px;border-image:url(../assets/e8666b5eb680848f69e4f1a789c20a87.webp) 240 fill / 134px stretch;filter:drop-shadow(0 10px 18px rgba(30,20,10,.3))}
.inner{position:absolute;inset:-98px;box-sizing:border-box;padding:24px 40px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.strip{background:#F8EBD6;border-radius:28px;padding:10px 30px;box-shadow:inset 0 -3px 0 #EAD3B0;display:flex;align-items:center;gap:14px}
.strip h1{margin:0;font-size:31px;line-height:1.3;font-weight:700;text-align:center}
.iconbtn{width:60px;height:60px;border-radius:50%;border:4px solid #C98A4B;background:#fff;box-shadow:0 4px 0 rgba(46,42,38,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-sizing:border-box}
.pill{background:#fff;border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;box-shadow:0 4px 0 rgba(46,42,38,.18);letter-spacing:.02em}
.bubble{position:absolute;left:28px;top:196px;width:272px;box-sizing:border-box;background:#fff;border:4px solid #E7B67C;border-radius:30px;padding:18px 22px;font-size:21px;font-weight:700;line-height:1.4;text-align:center;box-shadow:0 6px 0 rgba(46,42,38,.14)}
.dot{position:absolute;border-radius:50%;background:#fff;border:3px solid #E7B67C}
.btn{border:none;border-radius:999px;padding:16px 36px;font-family:inherit;font-size:23px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:transform .12s}
.btn:active{transform:translateY(3px)}
.row{display:flex;gap:30px}
.cell{position:relative;width:var(--s);height:var(--s);padding:0;border:none;background:none;font-family:inherit;perspective:700px}
.fin{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.face{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 5px 0 rgba(140,70,10,.22));-webkit-user-drag:none;user-select:none}
.fr{transform:rotateY(180deg)}
.num{position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:2}
.msg{display:flex;align-items:center;gap:12px;border-radius:999px;padding:12px 22px;font-size:21px;font-weight:600}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ===== LexiLand top navigation (shared) ===== */
.topnav{position:absolute;top:16px;left:22px;right:22px;height:74px;display:flex;align-items:center;justify-content:space-between;z-index:6;pointer-events:none}
.topnav>div{display:flex;align-items:center;gap:10px;pointer-events:auto}
.navback{display:block;width:70px;height:73px;transition:transform .12s}
.navback:active,.navmusic:active{transform:translateY(2px) scale(.97)}
.navback img,.navmusic img,.navstar img,.navlang img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.navtitle{height:64px;box-sizing:border-box;border-style:solid;border-width:0 40px;border-image:url(../assets/45d19c473a24c3db41cb93a31b33760f.png) 0 122 fill / 0 40px stretch;display:flex;align-items:center;padding:0 4px 5px;font-family:'Lexend',system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:.03em;color:#4A2410;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.navstar{position:relative;width:93px;height:60px}
.navstar>span{position:absolute;left:50px;width:32px;top:0;bottom:5px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#4A2410}
.navmusic{position:relative;width:70px;height:73px;padding:0;border:none;background:none;cursor:pointer;transition:transform .12s}
.navlang{position:relative;width:131px;height:60px}
.navlang button{position:absolute;top:13px;height:30px;width:50px;padding:0;border:none;background:none;border-radius:15px;cursor:pointer;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.navlang .si{font-family:'Noto Sans Sinhala',system-ui,sans-serif;font-size:16px}

.tracker{position:absolute;width:500px;height:55px;z-index:5}
.tracker img{display:block;width:500px;height:55px;pointer-events:none;user-select:none}
.tracker span{position:absolute;top:2.6px;width:45px;height:45px;border-radius:50%;box-sizing:border-box;pointer-events:none}
@keyframes trkpulse{0%,100%{box-shadow:0 0 0 3px #FFF6DC,0 0 10px 3px rgba(255,214,110,.85)}50%{box-shadow:0 0 0 3px #FFF6DC,0 0 18px 7px rgba(255,214,110,1)}}

/* ===== Layout balance (shared): tracker sits clear of the board, content evenly spaced ===== */
.tracker{top:92px !important}
.board{top:140px !important}
.inner{padding:30px 44px 34px !important;justify-content:space-evenly;row-gap:10px !important}
.inner>*{margin-top:0 !important;margin-bottom:0 !important}
.board>img:first-child{bottom:-170px !important}

/* ===== Responsive stage: designed at 1600×900 (16:9) and scaled to fit any laptop screen ===== */
.viewport{position:fixed;inset:0;overflow:hidden;background:#20301f}
.vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.root{position:absolute !important;left:50%;top:50%;width:1600px !important;height:900px !important;transform-origin:50% 50%;overflow:visible !important}
.root>img:first-child{display:none}
.board{left:500px !important;top:158px !important;width:980px !important;height:640px !important}
.tracker{top:110px !important}
.bubble{left:40px !important;top:196px !important;width:340px !important;font-size:23px !important;padding:20px 24px !important}
.board>img:first-child{bottom:-206px !important}
.topnav{top:20px !important;left:28px !important;right:28px !important}

/* ===== Stage v2: seamless vine board, balanced proportions (1600×900) ===== */
.board{border-image:none !important;border-color:transparent !important;background:url(../assets/e8666b5eb680848f69e4f1a789c20a87.webp) 0 0 / 100% 100% no-repeat !important;background-origin:border-box !important;top:175px !important;width:1000px !important;height:580px !important}
.tracker{top:124px !important}
.board>img:first-child{bottom:-236px !important}
.board{left:500px !important}
.tracker{left:750px !important}

/* ===== Centered layout: vine board + tracker centred on the 1600px stage ===== */
.board{left:300px !important;width:1000px !important}
.tracker{left:550px !important}
.root.q .board{left:300px !important}
.root.q .tracker{left:550px !important}
.bubble,.qbubble{left:20px !important;top:184px !important;width:262px !important;font-size:21px !important;padding:16px 18px !important}
</style>
</helmet>
<div class="viewport">
<img class="vbg" src="{{bgSrc}}" alt="">
<div class="root" style="{{stageStyle}}">
  <img src="{{bgSrc}}" alt="" style="position:absolute;inset:0;width:1280px;height:800px;object-fit:cover">

  <nav class="topnav" aria-label="Game navigation">
    <div>
      <a class="navback" href="{{backHref}}" aria-label="Back"><img src="../assets/8df4fc9d624722d5a1b6da5cd3f91e00.png" alt=""></a>
      <div class="navtitle">LEVEL 1 • PICTURE MEMORY</div>
    </div>
    <div>
      <div class="navstar" role="img" aria-label="{{navStarsLabel}}"><img src="../assets/fe727e3baa691011b578eb2e56de54ae.png" alt=""><span>{{navStars}}</span></div>
      <button class="navmusic" onClick="{{toggleMusic}}" aria-label="{{musicLabel}}" aria-pressed="{{musicMuted}}"><img src="../assets/be6c13121ad06ebc7e1ec721e4fea807.png" alt="">
        <sc-if value="{{musicMuted}}" hint-placeholder-val="{{ false }}"><svg style="position:absolute;inset:14px" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34 L34 6" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 34 L34 6" stroke="#D9472B" stroke-width="4" stroke-linecap="round"/></svg></sc-if>
      </button>
      <div class="navlang" role="group" aria-label="Language"><img src="{{navLangSrc}}" alt="">
        <button style="{{enStyle}}" onClick="{{setEn}}" aria-pressed="{{isEn}}">EN</button>
        <button class="si" style="{{siStyle}}" onClick="{{setSi}}" aria-pressed="{{isSi}}" lang="si">සිං</button>
      </div>
    </div>
  </nav>
  <div class="tracker" style="top:110px;left:740px" role="img" aria-label="{{trkLabel}}">
    <img src="../assets/d21f61cf7dfb32ed20cab63dae9199ad.png" alt="">
    <sc-for list="{{trk}}" as="k" hint-placeholder-count="5"><span style="{{k.style}}"></span></sc-for>
  </div>

  <div class="bubble">{{bubbleText}}</div>
  <div class="dot" style="left:196px;top:316px;width:22px;height:22px"></div>
  <div class="dot" style="left:182px;top:348px;width:13px;height:13px"></div>
  <img src="../assets/044c7ae59144599a3e2a41c9e1b3011a.webp" alt="" style="position:absolute;left:28px;bottom:36px;height:400px;transform:rotate(5deg);transform-origin:50% 100%;filter:drop-shadow(0 8px 10px rgba(30,20,10,.3))">

  <div class="board">
    <img src="{{bucketSrc}}" alt="" style="{{bucketStyle}}">
    <div class="inner">
      <div class="strip">
        <h1>{{title}}</h1>
        <button class="iconbtn" style="{{speakStyle}}" onClick="{{sayIt}}" aria-label="Hear the instruction"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 v4 h4 l5 4 V6 L8 10 Z" fill="{{text}}"/><path d="M16 9 q3 3 0 6 M18.5 7 q5 5 0 10" stroke="{{text}}" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
      </div>

      <!-- Row 1: the picture order to remember, then the answer slots -->
      <div class="row" role="list" style="{{rowStyle}}" aria-label="{{row1Label}}">
        <sc-for list="{{row1}}" as="c" hint-placeholder-count="3">
          <sc-if value="{{c.isCard}}" hint-placeholder-val="{{ true }}">
            <div class="cell" role="listitem" aria-label="{{c.aria}}">
              <div class="fin" style="{{c.flip}}"><img class="face" src="{{backSrc}}" alt=""><img class="face fr" src="{{c.src}}" alt=""></div>
            </div>
          </sc-if>
          <sc-if value="{{c.isSlot}}" hint-placeholder-val="{{ false }}">
            <button class="cell" role="listitem" style="{{c.slotStyle}}" onDragOver="{{c.over}}" onDragEnter="{{c.over}}" onDragLeave="{{c.leave}}" onDrop="{{c.drop}}" onClick="{{c.tap}}" aria-label="{{c.aria}}">
              <span class="num" style="{{c.numStyle}}">{{c.n}}</span>
              <sc-if value="{{c.filled}}" hint-placeholder-val="{{ false }}"><img class="face" src="{{c.src}}" alt="" style="animation:pop .25s ease-out"></sc-if>
              <sc-if value="{{c.empty}}" hint-placeholder-val="{{ true }}"><span style="{{c.qStyle}}">?</span></sc-if>
            </button>
          </sc-if>
        </sc-for>
      </div>

      <!-- Row 2: hidden until recall, then the same pictures shuffled -->
      <sc-if value="{{isRecall}}" hint-placeholder-val="{{ false }}">
      <div class="row" role="list" style="{{rowStyle}}" aria-label="{{row2Label}}">
        <sc-for list="{{row2}}" as="c" hint-placeholder-count="3">
          <button class="cell" role="listitem" draggable="{{c.draggable}}" style="{{c.cellStyle}}" onDragStart="{{c.dragStart}}" onDragEnd="{{dragEnd}}" onClick="{{c.tap}}" aria-label="{{c.aria}}" disabled="{{c.disabled}}">
            <div class="fin" style="{{c.flip}}"><img class="face" src="{{backSrc}}" alt=""><img class="face fr" src="{{c.src}}" alt=""></div>
          </button>
        </sc-for>
      </div>
      </sc-if>

      <div style="margin-top:auto;height:64px;display:flex;align-items:center;justify-content:center;gap:16px">
        <sc-if value="{{isReady}}" hint-placeholder-val="{{ false }}">
          <div style="width:720px;height:76px;box-sizing:border-box;background:#FFF8EE;border:3px solid #EFE0C6;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 8px 0 14px">
            <svg width="48" height="48" viewBox="0 0 56 56" aria-hidden="true" style="flex:none"><circle cx="15" cy="10" r="7" fill="#E0503C"/><circle cx="41" cy="10" r="7" fill="#E0503C"/><circle cx="28" cy="31" r="20" fill="#fff" stroke="#E0503C" stroke-width="5"/><path d="M28 19 V31 L36 35" fill="none" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round"/></svg>
            <span style="flex:1;font-size:19px;font-weight:600;line-height:1.3;color:#5E5348">Tap Play. You will have {{secs}} seconds to memorise the pictures.</span>
            <button class="btn" style="flex:none;background:#14A877;color:#fff;box-shadow:0 5px 0 #0B7A55;padding:13px 34px;font-size:22px;font-weight:700;letter-spacing:.04em" onClick="{{begin}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z" fill="#fff"/></svg>PLAY</button>
          </div>
        </sc-if>
        <sc-if value="{{isShow}}" hint-placeholder-val="{{ true }}">
          <div style="width:720px;height:76px;box-sizing:border-box;background:#FFF8EE;border:3px solid #EFE0C6;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 26px 0 14px" role="timer" aria-label="{{timeLabel}}">
            <svg width="48" height="48" viewBox="0 0 56 56" aria-hidden="true"><circle cx="15" cy="10" r="7" fill="#E0503C"/><circle cx="41" cy="10" r="7" fill="#E0503C"/><circle cx="28" cy="31" r="20" fill="#fff" stroke="#E0503C" stroke-width="5"/><path d="M28 19 V31 L36 35" fill="none" stroke="#2E2A26" stroke-width="3.5" stroke-linecap="round"/></svg>
            <span style="font-size:20px;font-weight:700;letter-spacing:.03em;white-space:nowrap">TIME LEFT: {{secs}}s</span>
            <div style="flex:1;height:16px;border-radius:8px;background:#EFE3CF;overflow:hidden"><div style="{{barStyle}}"></div></div>
          </div>
        </sc-if>
        <sc-if value="{{showControls}}" hint-placeholder-val="{{ false }}">
          <button class="btn" style="{{resetStyle}}" onClick="{{reset}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 a8 8 0 1 0 3 -6.2 M4 4 v5 h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Start over</button>
          <button class="btn" style="{{checkStyle}}" onClick="{{check}}" disabled="{{checkDisabled}}">Check</button>
        </sc-if>
        <sc-if value="{{isRight}}" hint-placeholder-val="{{ false }}">
          <div class="msg" style="background:#E3F3DC;color:#2C5A28"><svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#2C5A28"/><path d="M13 22 l6 6 12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>{{rightMsg}}</div>
          <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
            <button class="btn" style="{{nextStyle}}" onClick="{{next}}">Next<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </sc-if>
          <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
            <a class="btn" href="{{doneHref}}" style="background:#3F7D3A;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)">See results</a>
          </sc-if>
        </sc-if>
        <sc-if value="{{isWrong}}" hint-placeholder-val="{{ false }}">
          <div class="msg" style="background:#FFF0DD;color:#8A4006">Nice try! Let's look at the pictures again.</div>
          <button class="btn" style="{{retryStyle}}" onClick="{{retry}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 a8 8 0 1 0 3 -6.2 M4 4 v5 h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Try again</button>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
// ===== Level settings: the only part that differs between levels =====
const START = 'show';
const LV = { name:'LEVEL 1 · PICTURE MEMORY', badge:'Level 1', secs:5, cards:3, back:'../index.html#level-1', done:'Results-L1.dc.html', bg:'../assets/19e1e0ef4b5abf74b866c6b8715a6406.webp', bucket:'../assets/a96b7dec539708fa54439e522e70b9fc.png', bucketW:194, cardBack:'../assets/7d29b3697e4a26bafe6da9c8f95bbf39.png' };
const C = { accent:'#E07B1F', dark:'#B5560B', deep:'#8A4006', light:'#FDE3C6', text:'#8A4006', ring:'#FCD3A7', soft:'#FFF8EE', pillBg:'#FFE2B8', pillBorder:'#E7B67C', pillText:'#6E3F18' };
// Front-of-card pictures for this level (orange frame).
const PICS = [
  { name:'apple', src:'../assets/3f17d19053bd4bdeff4b7123c89996dc.png' },
  { name:'bird', src:'../assets/0c9916b1a357f32238caac15f594c802.png' },
  { name:'butterfly', src:'../assets/6406165f43a972849cda43e72373de0f.png' },
  { name:'tree', src:'../assets/4e4a5ce73f6e125224c55352b187c4f9.png' }
];
const ROUNDS = 5;
// ===== Shared game code =====
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
// Each round: a random order of pictures (row 1) and a different shuffled order of the same pictures (row 2).
const makeRound = () => {
  const seq = shuffle(PICS.map((_, i) => i)).slice(0, LV.cards);
  let mix; do { mix = shuffle(seq.map((_, i) => i)); } while (mix.every((p, i) => p === i));
  return { seq, mix };
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.resetRec();
    this.rounds = Array.from({ length: ROUNDS }, makeRound);
    this.drag = null;
    this.state = { q:0, screen:START, left:LV.secs * 1000, slots:Array(LV.cards).fill(null), sel:null, over:null, result:null, stars:0 };
  }
  componentWillUnmount() { clearInterval(this.iv); try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }
  begin() {
    clearInterval(this.iv);
    const T = LV.secs * 1000, t0 = Date.now();
    this.setState({ screen:'show', left:T, slots:Array(LV.cards).fill(null), sel:null, result:null });
    this.iv = setInterval(() => {
      const left = Math.max(0, T - (Date.now() - t0));
      if (left <= 0) { clearInterval(this.iv); this.setState({ screen:'recall', left:0 }); }
      else this.setState({ left });
    }, 100);
  }
  place(slot, card) {
    const st = this.state; if (st.result === 'right' || card === null || card === undefined) return;
    const slots = st.slots.map((v) => (v === card ? null : v));
    slots[slot] = card;
    this.setState({ slots, sel:null, over:null, result:null });
  }
  trackVals(cur) {
    if (typeof cur !== 'number' || isNaN(cur)) cur = (this.state && typeof this.state.q === 'number') ? this.state.q : 0;
    const CX = [46.5, 148.4, 250.3, 352.2, 454.0];
    const tick = "url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22><circle cx=%2210%22 cy=%2210%22 r=%229%22 fill=%22%233FA34D%22 stroke=%22white%22 stroke-width=%222%22/><path d=%22M6 10.5l2.6 2.6L14 7.6%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>') no-repeat right -1px top -1px / 19px 19px";
    return {
      trk: CX.map((x, i) => ({ style: 'left:' + (x - 22.5) + 'px;' + (i < cur ? 'background:' + tick + ';' : i === cur ? 'animation:trkpulse 1.6s ease-in-out infinite;transform:scale(1.1)' : 'background:rgba(55,30,10,.45)') })),
      trkLabel: 'Step ' + (cur + 1) + ' of 5'
    };
  }
  rec(i, ok) {
    // Saves the first answer for each question so the results screen can show the score.
    try {
      const ss = window.sessionStorage, k = 'lexi:res:Picture:L1', m = JSON.parse(ss.getItem(k) || '{}');
      if (!(i in m)) {
        m[i] = ok; ss.setItem(k, JSON.stringify(m));
        if (ok) { const ls = window.localStorage; ls.setItem('lexi:totalStars', String((parseInt(ls.getItem('lexi:totalStars') || '0', 10) || 0) + 5)); }
      }
      ss.setItem('lexi:last', 'Picture:L1');
    } catch (e) {}
  }
  resetRec() { try { window.sessionStorage.removeItem('lexi:res:Picture:L1'); } catch (e) {} }
  navVals() {
    const VW = (typeof window !== 'undefined' && window.innerWidth) || 1600, VH = (typeof window !== 'undefined' && window.innerHeight) || 900;
    if (!this._fitOn && typeof window !== 'undefined') { this._fitOn = true; window.addEventListener('resize', () => this.setState({})); }
    const N = this.nav || (this.nav = { lang: 'en', muted: false });
    const st = (this.state && typeof this.state.stars === 'number') ? this.state.stars : 0;
    const on = 'color:#fff', off = 'color:#6B3A1E';
    return {
      navStars: String(st), navStarsLabel: st + (st === 1 ? ' star' : ' stars'),
      stageStyle: 'transform:translate(-50%,-50%) scale(' + Math.min(VW / 1600, VH / 900) + ')',
      musicMuted: N.muted, musicLabel: N.muted ? 'Turn music on' : 'Turn music off',
      toggleMusic: () => { N.muted = !N.muted; this.setState({}); },
      navLangSrc: N.lang === 'en' ? '../assets/6f7c2bb7a5525738674145255fc58787.png' : '../assets/825f199a805633d8f930859013f1c3b0.png', isEn: N.lang === 'en', isSi: N.lang === 'si',
      enStyle: 'left:16px;' + (N.lang === 'en' ? on : off), siStyle: 'left:66px;' + (N.lang === 'si' ? on : off),
      setEn: () => { N.lang = 'en'; this.setState({}); }, setSi: () => { N.lang = 'si'; this.setState({}); }
    };
  }
  renderVals() {
    const s = this.state, R = this.rounds[s.q], n = LV.cards, last = s.q === ROUNDS - 1;
    const ready = s.screen === 'ready', show = s.screen === 'show', recall = s.screen === 'recall';
    const right = s.result === 'right', wrong = s.result === 'wrong';
    const pic = (p) => PICS[R.seq[p]];

    const dots = Array.from({ length: ROUNDS }, (_, i) => {
      const base = 'width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;box-sizing:border-box;';
      if (i < s.q) return { n: i + 1, style: base + 'background:' + C.accent + ';color:#fff;border:3px solid #fff' };
      if (i === s.q) return { n: i + 1, style: base + 'background:' + C.accent + ';color:#fff;border:3px solid #fff;box-shadow:0 0 0 4px ' + C.ring + ';transform:scale(1.1)' };
      return { n: i + 1, style: base + 'background:#F3E6D2;color:#B5A88F;border:3px solid #E3D3B8' };
    });

    const row1 = Array.from({ length: n }, (_, i) => {
      if (!recall) return {
        isCard: true, isSlot: false, src: pic(i).src,
        aria: show ? 'Picture ' + (i + 1) + ': ' + pic(i).name : 'Hidden card ' + (i + 1),
        flip: 'transform:rotateY(' + (show ? 180 : 0) + 'deg);transition-delay:' + (show ? i * 0.12 : 0) + 's'
      };
      const c = s.slots[i], filled = c !== null, ok = filled && R.mix[c] === i, hot = s.over === i;
      let st = 'box-sizing:border-box;border-radius:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
      if (filled) st += 'background:none;' + (right ? 'box-shadow:0 0 0 5px #3F7D3A;' : wrong && !ok ? 'box-shadow:0 0 0 5px #E8973A;' : '');
      else st += 'background:' + (hot ? C.light : C.soft) + ';border:4px dashed ' + C.accent + ';' + (hot || s.sel !== null ? 'box-shadow:0 0 0 6px ' + C.ring + ';' : '');
      return {
        isCard: false, isSlot: true, n: i + 1, filled, empty: !filled,
        src: filled ? pic(R.mix[c]).src : '',
        numStyle: 'background:' + (right ? '#3F7D3A' : C.dark),
        qStyle: 'font-size:' + (n > 4 ? 46 : 56) + 'px;font-weight:700;color:' + C.ring,
        slotStyle: st,
        aria: filled ? 'Place ' + (i + 1) + ': ' + pic(R.mix[c]).name + '. Tap to take it out.' : 'Empty place ' + (i + 1) + '. Drag a picture here.',
        over: (e) => { e.preventDefault(); if (this.state.over !== i) this.setState({ over: i }); },
        leave: () => { if (this.state.over === i) this.setState({ over: null }); },
        drop: (e) => {
          e.preventDefault(); let j = this.drag;
          try { const d = e.dataTransfer.getData('text/plain'); if (d !== '') j = Number(d); } catch (err) {}
          this.drag = null; if (j !== null) this.place(i, j); else this.setState({ over: null });
        },
        tap: () => {
          const st2 = this.state; if (st2.result === 'right') return;
          if (st2.sel !== null) return this.place(i, st2.sel);
          if (st2.slots[i] !== null) { const slots = st2.slots.slice(); slots[i] = null; this.setState({ slots, result: null }); }
        }
      };
    });

    const used = (j) => s.slots.indexOf(j) !== -1;
    const row2 = R.mix.map((p, j) => {
      const u = recall && used(j), sel = s.sel === j;
      return {
        src: pic(p).src, draggable: recall && !u && !right ? 'true' : 'false', disabled: !recall || u || right,
        flip: 'transform:rotateY(' + (recall ? 180 : 0) + 'deg) ' + (sel ? 'translateY(-8px)' : '') + ';transition-delay:' + (recall ? j * 0.12 : 0) + 's',
        cellStyle: (recall && !u && !right ? 'cursor:grab;' : 'cursor:default;') + (u ? 'opacity:.22;filter:grayscale(.6);' : '') + (sel ? 'border-radius:26px;box-shadow:0 0 0 5px ' + C.accent + ';' : ''),
        aria: recall ? (u ? pic(p).name + ', already placed' : pic(p).name + '. Drag it to a place, or tap it and then tap a place.') : 'Hidden card',
        dragStart: (e) => { this.drag = j; try { e.dataTransfer.setData('text/plain', String(j)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} },
        tap: () => {
          const st2 = this.state; if (!recall || st2.result === 'right' || used(j)) return;
          // Tapping a card puts it in the next empty place (easy on tablets).
          const empty = st2.slots.indexOf(null);
          if (empty !== -1) this.place(empty, j);
        }
      };
    });

    const full = s.slots.every((v) => v !== null);
    const secs = show ? Math.ceil(s.left / 1000) : LV.secs;
    const pct = Math.max(0, Math.min(100, (s.left / (LV.secs * 1000)) * 100));
    const title = recall ? 'Put the pictures in the correct order.' : 'Remember the order of the cards.';

    return { ...this.navVals(), ...this.trackVals(),
      bgSrc: LV.bg, backHref: LV.back, doneHref: LV.done, pillText: LV.name, badgeText: LV.badge, backSrc: LV.cardBack,
      bucketSrc: LV.bucket, bucketStyle: 'position:absolute;right:-186px;bottom:-198px;width:' + LV.bucketW + 'px;height:auto;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.38))',
      pillStyle: 'background:' + C.pillBg + ';border:3px solid ' + C.pillBorder + ';color:' + C.pillText,
      badgeStyle: 'background:' + C.dark + ';color:#fff;border:3px solid ' + C.deep + ';padding:12px 26px',
      dark: C.dark, text: C.text,
      dots, progressText: (s.q + 1) + ' / ' + ROUNDS, progressLabel: 'Round ' + (s.q + 1) + ' of ' + ROUNDS,
      bubbleText: recall ? 'Drag the pictures into the correct order!' : show ? 'Memorise the order of the pictures!' : 'Tap the Play button when you\'re ready!',
      title,
      speakStyle: 'width:52px;height:52px;border:none;background:#fff;box-shadow:0 3px 0 rgba(46,42,38,.15)',
      sayIt: () => { try { const ss = window.speechSynthesis; ss.cancel(); const u = new window.SpeechSynthesisUtterance(title); u.lang = 'en-GB'; u.rate = 0.85; ss.speak(u); } catch (e) {} },
      row1, row2,
      rowStyle: '--s:' + ({3:140,4:140,5:124,6:112}[n] || 112) + 'px;gap:' + ({3:30,4:26,5:22,6:16}[n] || 16) + 'px',
      row1Label: recall ? 'Answer places' : 'Pictures to remember',
      row2Label: recall ? 'Shuffled pictures' : 'Hidden cards',
      isReady: ready, isShow: show, isRecall: recall,
      secs, timeLabel: secs + ' seconds left',
      barStyle: 'height:16px;border-radius:8px;background:' + C.accent + ';width:' + pct + '%;transition:width .1s linear',
      begin: () => this.begin(),
      dragEnd: () => { this.drag = null; if (this.state.over !== null) this.setState({ over: null }); },
      showControls: recall && !right && !wrong, isRight: right, isWrong: wrong,
      resetStyle: 'background:' + C.light + ';color:' + C.text + ';border:3px solid ' + C.accent + ';padding:13px 26px',
      reset: () => this.setState({ slots: Array(n).fill(null), sel: null, result: null }),
      checkDisabled: !full,
      checkStyle: full ? 'background:' + C.dark + ';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)' : 'background:#E5DED1;color:#8A7F70;cursor:not-allowed',
      check: () => {
        const st = this.state; if (!st.slots.every((v) => v !== null)) return;
        const ok = st.slots.every((c, i) => R.mix[c] === i); this.rec(st.q, ok);
        this.setState({ result: ok ? 'right' : 'wrong', sel: null, stars: st.stars + (ok ? 1 : 0) });
      },
      rightMsg: last ? 'All 5 done! Super memory!' : 'Well done! You remembered the order!',
      notLast: !last, isLast: last,
      nextStyle: 'background:' + C.dark + ';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)',
      retryStyle: 'background:' + C.light + ';color:' + C.text + ';border:3px solid ' + C.accent,
      next: () => { clearInterval(this.iv); this.setState({ q: this.state.q + 1, screen: 'ready', left: LV.secs * 1000, slots: Array(n).fill(null), sel: null, result: null }); },
      retry: () => this.begin()
    };
  }
}
</script>
</body>
</html>
