<style>
body{margin:0}
a{color:#2C5A28}a:hover{color:#1F4019}
.root{position:relative;width:1280px;height:800px;overflow:hidden;font-family:'Lexend',system-ui,sans-serif;color:#2E2A26}

.inner{position:absolute;inset:-98px;box-sizing:border-box;padding:24px 36px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.strip{background:#F8EBD6;border-radius:28px;padding:12px 26px;box-shadow:inset 0 -3px 0 #EAD3B0;display:flex;align-items:center;gap:14px}
.strip h1{margin:0;font-size:29px;line-height:1.3;font-weight:700;text-align:center}
.iconbtn{width:60px;height:60px;border-radius:50%;border:4px solid #C98A4B;background:#fff;box-shadow:0 4px 0 rgba(46,42,38,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-sizing:border-box}
.pill{background:#fff;border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;box-shadow:0 4px 0 rgba(46,42,38,.18);letter-spacing:.02em}
.btn{border:none;border-radius:999px;padding:16px 34px;font-family:inherit;font-size:23px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:transform .15s}
.btn:active{transform:translateY(3px)}
.chip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:10px 22px;box-shadow:0 3px 0 rgba(46,42,38,.1);font-size:19px;font-weight:600}
.card{position:relative;height:150px;box-sizing:border-box;border:4px solid;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:grab;font-family:inherit;padding:10px;transition:transform .15s,box-shadow .15s;color:#2E2A26}
.card:hover{transform:translateY(-3px)}
.card span{font-size:17px;font-weight:600;line-height:1.25;text-align:center}
.lbl{font-size:17px;font-weight:600;line-height:1.25;text-align:center}
.badge{position:absolute;top:-16px;left:50%;transform:translateX(-50%);border-radius:999px;padding:5px 14px;font-size:16px;font-weight:700;white-space:nowrap}
.msg{display:flex;align-items:center;gap:12px;border-radius:999px;padding:12px 22px;font-size:21px;font-weight:600}
.bucket{position:absolute;right:-186px;bottom:-182px;width:198px;height:auto;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
@keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ===== LexiLand top navigation (shared) ===== */
.topnav{position:absolute;top:16px;left:22px;right:22px;height:74px;display:flex;align-items:center;justify-content:space-between;z-index:6;pointer-events:none}
.topnav>div{display:flex;align-items:center;gap:10px;pointer-events:auto}
.navback{display:block;width:70px;height:73px;transition:transform .12s}
.navback:active,.navmusic:active{transform:translateY(2px) scale(.97)}
.navback img,.navmusic img,.navstar img,.navlang img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.navtitle{height:64px;box-sizing:border-box;border-style:solid;border-width:0 40px;border-image:url(../assets/45d19c473a24c3db41cb93a31b33760f.png) 0 122 fill / 0 40px stretch;display:flex;align-items:center;padding:0 4px 5px;font-family:'Lexend',system-ui,sans-serif;font-size:22px;font-weight:700;letter-spacing:.03em;color:#4A2410;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.navstar{position:relative;width:93px;height:60px}
.navstar>span{position:absolute;left:50px;width:32px;top:0;bottom:5px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#4A2410}
.navmusic{position:relative;width:70px;height:73px;padding:0;border:none;background:none;cursor:pointer;transition:transform .12s}
.navlang{position:relative;width:131px;height:60px}
.navlang button{position:absolute;top:13px;height:30px;width:50px;padding:0;border:none;background:none;border-radius:15px;cursor:pointer;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.navlang .si{font-family:'Noto Sans Sinhala',system-ui,sans-serif;font-size:16px}

.tracker{position:absolute;width:500px;height:55px;z-index:5}
.tracker img{display:block;width:500px;height:55px;pointer-events:none;user-select:none}
.tracker span{position:absolute;top:2.6px;width:45px;height:45px;border-radius:50%;box-sizing:border-box;pointer-events:none}
@keyframes trkpulse{0%,100%{box-shadow:0 0 0 3px #FFF6DC,0 0 10px 3px rgba(255,214,110,.85)}50%{box-shadow:0 0 0 3px #FFF6DC,0 0 18px 7px rgba(255,214,110,1)}}

/* ===== Layout balance (shared): tracker sits clear of the board, content evenly spaced ===== */
.tracker{top:92px !important}
.board{top:140px !important}
.inner{padding:30px 44px 34px !important;justify-content:space-evenly;row-gap:10px !important}
.inner>*{margin-top:0 !important;margin-bottom:0 !important}
.board>img:first-child{bottom:-174px !important;right:-286px !important}

/* ===== Text answer choices (1, 2, 3) ===== */
.choices{display:flex;flex-direction:column;gap:14px;width:680px}

/* ===== Responsive stage: designed at 1600×900 (16:9) and scaled to fit any laptop screen ===== */

.board{border-image:none !important;border-color:transparent !important;background:url(../assets/e8666b5eb680848f69e4f1a789c20a87.webp) 0 0 / 100% 100% no-repeat !important;background-origin:border-box !important;top:175px !important;width:1000px !important;height:580px !important}
.tracker{top:124px !important}
.board>img:first-child{bottom:-236px !important}
.board{left:300px !important}
.tracker{left:550px !important}

.qdot{position:absolute;border-radius:50%;background:#fff;border:3px solid #E7B67C;z-index:3}

/* ===== Centered layout: vine board + tracker centred on the 1600px stage ===== */
.board{left:300px !important;width:1000px !important}
.tracker{left:550px !important}
.root.q .board{left:300px !important}
.root.q .tracker{left:550px !important}
.bubble,.qbubble{left:20px !important;top:184px !important;width:262px !important;font-size:21px !important;padding:16px 18px !important}
</style>

<div class="viewport">
<img class="vbg" src="{{bgSrc}}" alt="">
<div class="root {{screenCls}}" style="{{stageStyle}}">
  <img src="{{bgSrc}}" alt="" style="position:absolute;inset:0;width:1280px;height:800px;object-fit:cover">

  <nav class="topnav" aria-label="Game navigation">
    <div>
      <a class="navback" href="{{backHref}}" aria-label="Back"><img src="../assets/8df4fc9d624722d5a1b6da5cd3f91e00.png" alt=""></a>
      <div class="navtitle">LEVEL 2 • FOLLOWING INSTRUCTIONS</div>
    </div>
    <div>
      <div class="navstar" role="img" aria-label="{{navStarsLabel}}"><img src="../assets/fe727e3baa691011b578eb2e56de54ae.png" alt=""><span>{{navStars}}</span></div>
      <button class="navmusic" onClick="{{toggleMusic}}" aria-label="{{musicLabel}}" aria-pressed="{{musicMuted}}"><img src="../assets/be6c13121ad06ebc7e1ec721e4fea807.png" alt="">
        <sc-if value="{{musicMuted}}" hint-placeholder-val="{{ false }}"><svg style="position:absolute;inset:14px" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34 L34 6" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M6 34 L34 6" stroke="#D9472B" stroke-width="4" stroke-linecap="round"/></svg></sc-if>
      </button>
      <div class="navlang" role="group" aria-label="Language"><img src="{{navLangSrc}}" alt="">
        <button style="{{enStyle}}" onClick="{{setEn}}" aria-pressed="{{isEn}}">EN</button>
        <button class="si" style="{{siStyle}}" onClick="{{setSi}}" aria-pressed="{{isSi}}" lang="si">සිං</button>
      </div>
    </div>
  </nav>
  <div class="tracker" style="top:110px;left:550px" role="img" aria-label="{{trkLabel}}">
    <img src="../assets/d21f61cf7dfb32ed20cab63dae9199ad.png" alt="">
    <sc-for list="{{trk}}" as="k" hint-placeholder-count="5"><span style="{{k.style}}"></span></sc-for>
  </div>

  <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
    <img src="../assets/044c7ae59144599a3e2a41c9e1b3011a.webp" alt="" style="position:absolute;left:28px;bottom:36px;height:400px;transform:rotate(5deg);transform-origin:50% 100%;filter:drop-shadow(0 8px 10px rgba(40,30,10,.3));z-index:2">
    <div class="qbubble">Choose the correct instruction!</div>
    <div class="qdot" style="left:196px;top:316px;width:22px;height:22px"></div>
    <div class="qdot" style="left:182px;top:348px;width:13px;height:13px"></div>
  </sc-if>

  <div class="board">
    <img class="bucket" src="{{bucketSrc}}" alt="">
    <div class="inner">

      <sc-if value="{{isListen}}" hint-placeholder-val="{{ false }}">
        <div class="strip"><h1>Listen carefully and remember<br>the steps in order.</h1></div>

        <div style="position:relative;width:100%;height:250px;display:flex;align-items:center;justify-content:center;gap:18px">
          <svg width="92" height="140" viewBox="0 0 92 140" aria-hidden="true">
            <path d="M72 45 Q56 70 72 95" fill="none" stroke-width="6" stroke-linecap="round" style="{{w1}}"/>
            <path d="M52 30 Q26 70 52 110" fill="none" stroke-width="6" stroke-linecap="round" style="{{w2}}"/>
            <path d="M32 15 Q-4 70 32 125" fill="none" stroke-width="6" stroke-linecap="round" style="{{w3}}"/>
          </svg>
          <img src="../assets/044c7ae59144599a3e2a41c9e1b3011a.webp" alt="Bunny listening" style="{{bunnyStyle}}">
          <svg width="92" height="140" viewBox="0 0 92 140" aria-hidden="true">
            <path d="M20 45 Q36 70 20 95" fill="none" stroke-width="6" stroke-linecap="round" style="{{w1}}"/>
            <path d="M40 30 Q66 70 40 110" fill="none" stroke-width="6" stroke-linecap="round" style="{{w2}}"/>
            <path d="M60 15 Q96 70 60 125" fill="none" stroke-width="6" stroke-linecap="round" style="{{w3}}"/>
          </svg>
          
          
          
        </div>

        

        <div style="display:flex;gap:22px;margin-top:auto">
          <button class="btn" style="{{listenStyle}}" onClick="{{play}}">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 v4 h4 l5 4 V6 L8 10 Z" fill="currentColor"/><path d="M16 9 q3 3 0 6 M18.5 7 q5 5 0 10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>{{listenLabel}}</button>
          <button class="btn" style="{{showStyle}}" onClick="{{showQuestion}}" disabled="{{showDisabled}}">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z" fill="currentColor"/></svg>Show question</button>
        </div>
      </sc-if>

      <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
        <div class="strip">
          <h1>{{question}}</h1>
          <button class="iconbtn" style="{{qSpeakStyle}}" onClick="{{sayQuestion}}" aria-label="Hear the question"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 v4 h4 l5 4 V6 L8 10 Z" fill="{{text}}"/><path d="M16 9 q3 3 0 6" stroke="{{text}}" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
        </div>

        <div class="choices" role="radiogroup" aria-label="{{question}}">
          <sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
            <button class="choice" role="radio" aria-checked="{{c.checked}}" style="{{c.style}}" onClick="{{c.pick}}">
              <span class="cnum" style="{{c.numStyle}}">{{c.num}}</span>
              <span class="ctext">{{c.text}}</span>
              <sc-if value="{{c.ok}}" hint-placeholder-val="{{ false }}"><svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#3F7D3A"/><path d="M13 22 l6 6 12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if>
            </button>
          </sc-for>
        </div>

        <div style="margin-top:auto;height:62px;display:flex;align-items:center;gap:18px">
          <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
            <button class="btn" style="{{checkStyle}}" onClick="{{check}}" disabled="{{checkDisabled}}">Check</button>
          </sc-if>
          <sc-if value="{{isRight}}" hint-placeholder-val="{{ false }}">
            <div class="msg" style="background:#E3F3DC;color:#2C5A28"><svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#2C5A28"/><path d="M13 22 l6 6 12 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>{{rightMsg}}</div>
            <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
              <button class="btn" style="{{nextStyle}}" onClick="{{next}}">Next<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </sc-if>
            <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
              <a class="btn" href="Results-L2.dc.html" style="background:#3F7D3A;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)">See results</a>
            </sc-if>
          </sc-if>
          <sc-if value="{{isWrong}}" hint-placeholder-val="{{ false }}">
            <div class="msg" style="background:#FFF0DD;color:#8A4006">Good try! Let's listen again!</div>
            <button class="btn" style="{{relistenStyle}}" onClick="{{relisten}}">
              <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 v4 h4 l5 4 V6 L8 10 Z" fill="currentColor"/></svg>Listen again</button>
          </sc-if>
        </div>
      </sc-if>

    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
// ===== Level settings: the only part that differs between levels =====
const START = 'question';
const LV = { name:'LEVEL 2 · INSTRUCTIONS', back:'../index.html#level-2', bg:'../assets/5d089e148319b17b2ec4bea0b967a6d4.webp', bucket:'../assets/e0f2033456663ba8bc79ef176439d350.png', btn:'../assets/6829b4b1138e27ccfd69e203f73fb19d.png' };
const C = { accent:'#5BA35A', dark:'#3A7A39', light:'#DDEFD3', text:'#2C5A28', ring:'#CFE8C6', soft:'#F4FAF0', pillBg:'#E1F0D8', pillBorder:'#9BC596', pillText:'#2C5A28' };
// Level 2: three instructions; asks about the first, second or last step; three answer cards.
const QS = [
  { steps:[['apple','Pick up the apple'],['moon','Touch the moon'],['flower','Smell the flower']], ask:2, last:true, opts:[1,2,0], answer:1 },
  { steps:[['star','Find the star'],['carrot','Give the bunny a carrot'],['heart','Draw a heart']], ask:1, opts:[0,2,1], answer:2 },
  { steps:[['leaf','Touch the green leaf'],['apple','Pick up the red apple'],['star','Find the yellow star']], ask:0, opts:[0,2,1], answer:0 },
  { steps:[['flower','Smell the pink flower'],['heart','Draw a big heart'],['moon','Touch the moon']], ask:1, opts:[2,1,0], answer:1 },
  { steps:[['carrot','Give the bunny a carrot'],['leaf','Pick up the leaf'],['apple','Find the red apple']], ask:2, last:true, opts:[0,1,2], answer:2 }
];
// ===== Shared game code (identical for every level) =====
const PIC = { carrot:'../assets/277ebc5eed6161299f9afb7c3af067a5.svg', apple:'../assets/b564c64dfe55eb342d9a8e4dacad5840.svg', leaf:'../assets/55b9611b9adb114aa3fcd2cd022c689b.svg', flower:'../assets/2adfd57cc4f9879fa40a5588e2e0f537.svg', star:'../assets/08972e9a7b847e601287bdb7cfcdfd8a.svg', heart:'../assets/f97054304c9330c9ea85ef7dcb0d6544.svg', moon:'../assets/c24e3f90ec771704f719713c7e374cc5.svg' };
const ORD = ['first','second','third','fourth','fifth'];
const BADGE = ['1st','2nd','3rd','4th','5th'];
const TINT = ['background:#FFF1E3;border-color:#F6CFA4;box-shadow:0 5px 0 #EFC79B', 'background:#EAF3FE;border-color:#BFD7F5;box-shadow:0 5px 0 #B3CDEE', 'background:#EAF7EC;border-color:#BFE3C4;box-shadow:0 5px 0 #B2DAB8', 'background:#F4EDFC;border-color:#D7C6F1;box-shadow:0 5px 0 #CCB8EC'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.resetRec();
    this.state = { q:0, screen:START, step:-1, playing:false, heard:START === 'question', placed:null, over:false, result:null, stars:0 };
    this.tok = 0; this.drag = null;
  }
  componentWillUnmount() { this.stop(); }
  stop() {
    this.tok++;
    clearTimeout(this.t1); clearTimeout(this.t2);
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }
  say(text, done) {
    const tok = this.tok; let fired = false;
    const fin = () => { if (fired || tok !== this.tok) return; fired = true; clearTimeout(this.t2); done(); };
    try {
      if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
        const u = new window.SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; u.rate = 0.8; u.onend = fin; u.onerror = fin;
        window.speechSynthesis.speak(u);
        this.t2 = setTimeout(fin, 8000);
        return;
      }
    } catch (e) {}
    this.t2 = setTimeout(fin, 1600 + text.length * 50);
  }
  question() { const Q = QS[this.state.q]; return 'What is the ' + (Q.last ? 'last' : ORD[Q.ask]) + ' instruction?'; }
  trackVals(cur) {
    if (typeof cur !== 'number' || isNaN(cur)) cur = (this.state && typeof this.state.q === 'number') ? this.state.q : 0;
    const CX = [46.5, 148.4, 250.3, 352.2, 454.0];
    const tick = "url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22><circle cx=%2210%22 cy=%2210%22 r=%229%22 fill=%22%233FA34D%22 stroke=%22white%22 stroke-width=%222%22/><path d=%22M6 10.5l2.6 2.6L14 7.6%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>') no-repeat right -1px top -1px / 19px 19px";
    return {
      trk: CX.map((x, i) => ({ style: 'left:' + (x - 22.5) + 'px;' + (i < cur ? 'background:' + tick + ';' : i === cur ? 'animation:trkpulse 1.6s ease-in-out infinite;transform:scale(1.1)' : 'background:rgba(55,30,10,.45)') })),
      trkLabel: 'Step ' + (cur + 1) + ' of 5'
    };
  }
  rec(i, ok) {
    // Saves the first answer for each question so the results screen can show the score.
    try {
      const ss = window.sessionStorage, k = 'lexi:res:Instruct:L2', m = JSON.parse(ss.getItem(k) || '{}');
      if (!(i in m)) {
        m[i] = ok; ss.setItem(k, JSON.stringify(m));
        if (ok) { const ls = window.localStorage; ls.setItem('lexi:totalStars', String((parseInt(ls.getItem('lexi:totalStars') || '0', 10) || 0) + 5)); }
      }
      ss.setItem('lexi:last', 'Instruct:L2');
    } catch (e) {}
  }
  resetRec() { try { window.sessionStorage.removeItem('lexi:res:Instruct:L2'); } catch (e) {} }
  navVals() {
    const VW = (typeof window !== 'undefined' && window.innerWidth) || 1600, VH = (typeof window !== 'undefined' && window.innerHeight) || 900;
    if (!this._fitOn && typeof window !== 'undefined') { this._fitOn = true; window.addEventListener('resize', () => this.setState({})); }
    const N = this.nav || (this.nav = { lang: 'en', muted: false });
    const st = (this.state && typeof this.state.stars === 'number') ? this.state.stars : 0;
    const on = 'color:#fff', off = 'color:#6B3A1E';
    return {
      navStars: String(st), navStarsLabel: st + (st === 1 ? ' star' : ' stars'),
      screenCls: (this.state && this.state.screen === 'question') ? 'q' : '',
      stageStyle: 'transform:translate(-50%,-50%) scale(' + Math.min(VW / 1600, VH / 900) + ')',
      musicMuted: N.muted, musicLabel: N.muted ? 'Turn music on' : 'Turn music off',
      toggleMusic: () => { N.muted = !N.muted; this.setState({}); },
      navLangSrc: N.lang === 'en' ? '../assets/6f7c2bb7a5525738674145255fc58787.png' : '../assets/825f199a805633d8f930859013f1c3b0.png', isEn: N.lang === 'en', isSi: N.lang === 'si',
      enStyle: 'left:16px;' + (N.lang === 'en' ? on : off), siStyle: 'left:66px;' + (N.lang === 'si' ? on : off),
      setEn: () => { N.lang = 'en'; this.setState({}); }, setSi: () => { N.lang = 'si'; this.setState({}); }
    };
  }
  renderVals() {
    const s = this.state, Q = QS[s.q], last = s.q === QS.length - 1;
    const right = s.result === 'right', wrong = s.result === 'wrong';
    const optOf = (o) => (typeof o === 'number' ? Q.steps[o] : o);

    const dots = QS.map((_, i) => {
      const base = 'width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;box-sizing:border-box;';
      if (i < s.q) return { n: i + 1, style: base + 'background:' + C.accent + ';color:#fff;border:3px solid #fff' };
      if (i === s.q) return { n: i + 1, style: base + 'background:' + C.accent + ';color:#fff;border:3px solid #fff;box-shadow:0 0 0 4px #FFD08A;transform:scale(1.12)' };
      return { n: i + 1, style: base + 'background:#6E3F18;color:#F3D9B8;border:3px solid #8E5A2C' };
    });

    const p = s.playing;
    const wave = (d) => 'stroke:' + C.accent + ';' + (p ? 'animation:wave 1.2s ease-in-out ' + d + 's infinite' : 'opacity:.35');
    const bars = [0, .15, .3, .45].map((d) => ({ style: 'display:block;width:7px;height:24px;border-radius:4px;background:' + C.accent + ';transform-origin:50% 100%;' + (p ? 'animation:eq .8s ease-in-out ' + d + 's infinite' : 'transform:scaleY(.4);opacity:.5') }));
    const stepDots = Q.steps.map((_, i) => ({ style: 'display:block;width:14px;height:14px;border-radius:50%;' + (i < s.step || (s.heard && !p) ? 'background:' + C.accent : i === s.step && p ? 'background:' + C.accent + ';box-shadow:0 0 0 4px ' + C.ring : 'background:#E2DCCD') }));
    let status = 'Tap Listen to hear the steps';
    if (p) status = 'Listening…';
    else if (s.heard) status = 'Great! Ready for the question?';

    const tiles = Q.steps.map((_, i) => ({
      isDrop: i === Q.ask, isLocked: i !== Q.ask, arrow: i < Q.steps.length - 1,
      badge: Q.last && i === Q.ask ? 'Last' : BADGE[i],
      badgeStyle: 'background:' + C.dark + ';color:#fff'
    }));
    let dropStyle = 'position:relative;width:240px;height:150px;box-sizing:border-box;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;cursor:pointer;padding:10px;color:#2E2A26;';
    if (right) dropStyle += 'background:#E3F3DC;border:4px solid #3F7D3A;box-shadow:0 0 0 6px #CFE8C6';
    else if (wrong) dropStyle += 'background:#FFF6EA;border:4px dashed #D9822B';
    else if (s.over) dropStyle += 'background:' + C.light + ';border:4px solid ' + C.accent + ';box-shadow:0 0 0 7px ' + C.ring + ';transform:scale(1.03)';
    else if (s.placed !== null) dropStyle += 'background:#fff;border:4px solid ' + C.accent;
    else dropStyle += 'background:' + C.soft + ';border:4px dashed ' + C.accent;
    const placed = s.placed !== null ? optOf(Q.opts[s.placed]) : null;

    // Three text answers numbered 1, 2, 3 (a 4th distractor, if any, is left out)
    const CH = (() => {
      let idx = Q.opts.map((_, i) => i);
      while (idx.length > 3) { const k = idx.lastIndexOf(idx.filter((i) => i !== Q.answer).pop()); idx.splice(k, 1); }
      return { list: idx.map((i) => optOf(Q.opts[i])), answer: idx.indexOf(Q.answer) };
    })();
    const choices = CH.list.map((o, i) => {
      const sel = s.placed === i;
      let st = '';
      if (sel && right) st = 'border-color:#3F7D3A;background:#EEF8EA;box-shadow:0 0 0 6px #CFE8C6';
      else if (sel && wrong) st = 'border-color:#D9822B;border-style:dashed;background:#FFF6EA;box-shadow:none';
      else if (sel) st = 'border-color:' + C.accent + ';background:' + C.soft + ';box-shadow:0 0 0 6px ' + C.ring + ';transform:translateY(-2px)';
      else if (right) st = 'opacity:.55';
      return {
        num: i + 1, text: o[1], checked: sel, ok: sel && right, style: st,
        numStyle: 'background:url(' + LV.btn + ') center / 100% 100% no-repeat;text-shadow:0 2px 0 ' + C.dark,
        pick: () => { if (this.state.result !== 'right') this.setState({ placed: i, result: null }); }
      };
    });

    const cw = Q.opts.length > 3 ? 180 : 196;
    const opts = Q.opts.map((raw, i) => {
      const o = optOf(raw);
      return {
        show: s.placed !== i, empty: s.placed === i,
        src: PIC[o[0]], label: o[1], aria: o[1] + '. Drag it to the answer box, or tap to place it.',
        boxStyle: 'width:' + cw + 'px;height:150px',
        style: TINT[i % 4] + ';width:' + cw + 'px',
        emptyStyle: 'width:' + cw + 'px;height:150px;box-sizing:border-box;border:4px dashed #E6D8C1;border-radius:28px',
        dragStart: (e) => { this.drag = i; try { e.dataTransfer.setData('text/plain', String(i)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} },
        tap: () => { if (this.state.result !== 'right') this.setState({ placed: i, result: null }); }
      };
    });

    return { ...this.navVals(), ...this.trackVals(),
      bgSrc: LV.bg, bucketSrc: LV.bucket, backHref: LV.back, pillText: LV.name,
      pillStyle: 'background:' + C.pillBg + ';border:3px solid ' + C.pillBorder + ';color:' + C.pillText,
      dark: C.dark, text: C.text,
      isListen: s.screen === 'listen', isQuestion: s.screen === 'question',
      dots, progressLabel: 'Question ' + (s.q + 1) + ' of ' + QS.length,
      stars: s.stars, starsLabel: s.stars + ' stars',
      w1: wave(0), w2: wave(.2), w3: wave(.4), bars, stepDots, status,
      bunnyStyle: 'height:236px;filter:drop-shadow(0 8px 10px rgba(40,30,10,.22));' + (p ? 'animation:bob 1.6s ease-in-out infinite' : ''),
      listenLabel: s.heard ? 'Listen again' : 'Listen again',
      listenStyle: 'background:' + C.light + ';color:' + C.text + ';border:3px solid ' + C.accent + ';box-shadow:0 5px 0 ' + C.ring,
      showStyle: s.heard && !p ? 'background:' + C.dark + ';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)' : 'background:#E5DED1;color:#8A7F70;cursor:not-allowed',
      showDisabled: !s.heard || p,
      play: () => {
        this.stop(); const tok = this.tok;
        this.setState({ playing: true, step: -1 });
        const run = (i) => {
          if (tok !== this.tok) return;
          if (i >= Q.steps.length) { this.setState({ playing: false, step: Q.steps.length, heard: true }); return; }
          this.setState({ step: i });
          this.say(Q.steps[i][1] + '.', () => { this.t1 = setTimeout(() => run(i + 1), 700); });
        };
        this.t1 = setTimeout(() => run(0), 350);
      },
      showQuestion: () => { this.stop(); this.setState({ screen: 'question', playing: false, placed: null, result: null }); },

      question: this.question(), tiles, dropStyle, opts, choices,
      qSpeakStyle: 'width:50px;height:50px;border:none;background:' + C.light + ';box-shadow:none',
      dragTextStyle: 'color:' + C.text,
      hasPlaced: !!placed, noPlaced: !placed,
      placedSrc: placed ? PIC[placed[0]] : '', placedLabel: placed ? placed[1] : '',
      dropAria: placed ? 'Your answer: ' + placed[1] + '. Tap to take it out.' : 'Answer box for the ' + (Q.last ? 'last' : ORD[Q.ask]) + ' instruction. Drag a card here.',
      dragOver: (e) => { e.preventDefault(); if (!this.state.over) this.setState({ over: true }); },
      dragLeave: () => { if (this.state.over) this.setState({ over: false }); },
      dragEnd: () => { this.drag = null; if (this.state.over) this.setState({ over: false }); },
      dropIt: (e) => {
        e.preventDefault();
        let i = this.drag;
        try { const d = e.dataTransfer.getData('text/plain'); if (d !== '') i = Number(d); } catch (err) {}
        this.drag = null;
        if (i !== null && this.state.result !== 'right') this.setState({ placed: i, over: false, result: null });
        else this.setState({ over: false });
      },
      clearSlot: () => { if (this.state.result !== 'right') this.setState({ placed: null, result: null }); },
      sayQuestion: () => { this.stop(); this.say(this.question(), () => {}); },
      showCheck: !right && !wrong, isRight: right, isWrong: wrong,
      checkDisabled: s.placed === null,
      checkStyle: s.placed === null ? 'background:#E5DED1;color:#8A7F70;cursor:not-allowed' : 'background:' + C.dark + ';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)',
      check: () => {
        if (this.state.placed === null) return;
        const ok = this.state.placed === CH.answer; this.rec(this.state.q, ok);
        this.setState({ result: ok ? 'right' : 'wrong', stars: this.state.stars + (ok ? 1 : 0) });
      },
      rightMsg: last ? 'All 5 done! Number Memory is open!' : 'Great listening!',
      notLast: !last, isLast: last,
      nextStyle: 'background:' + C.dark + ';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)',
      relistenStyle: 'background:' + C.light + ';color:' + C.text + ';border:3px solid ' + C.accent,
      next: () => { this.stop(); this.setState({ q: this.state.q + 1, screen: 'listen', step: -1, playing: false, heard: false, placed: null, result: null }); },
      relisten: () => { this.stop(); this.setState({ screen: 'listen', step: -1, playing: false, placed: null, result: null }); }
    };
  }
}
</script>
